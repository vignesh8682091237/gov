services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-consent_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-consent_analytics}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consent_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in .env}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-consent_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-consent_analytics}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MASK_IPS_IN_DASHBOARD: ${MASK_IPS_IN_DASHBOARD:-true}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-180}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
